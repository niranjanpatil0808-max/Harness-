# Runs the real-model benchmark on GitHub's servers.
# Needs one repository secret: KINTSUGI_API_KEY (Settings > Secrets and variables > Actions).
# Starts when research/benchmark/run.config is pushed to this branch (or by hand from the Actions tab).
name: benchmark

on:
  push:
    branches: [claude/ecstatic-cray-g930so]
    paths: [research/benchmark/run.config]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and run the offline checks
        run: |
          pip install -e .
          python -m unittest discover -s tests
          python research/benchmark/check_tasks.py

      - name: List the models this key can use
        continue-on-error: true
        env:
          KINTSUGI_API_KEY: ${{ secrets.KINTSUGI_API_KEY }}
        run: |
          set -a; . research/benchmark/run.config; set +a
          kintsugi models

      - name: Run the benchmark on the real model(s)
        env:
          KINTSUGI_API_KEY: ${{ secrets.KINTSUGI_API_KEY }}
        run: |
          if [ -z "$KINTSUGI_API_KEY" ]; then
            echo "Secret KINTSUGI_API_KEY is not set. Add it under Settings > Secrets and variables > Actions." >&2
            exit 1
          fi
          set -a; . research/benchmark/run.config; set +a
          status=0
          # One run per "model|max_tokens|repeats|modes|temperature|extra_json|split" entry in RUNS, one after
          # the other (shared rate limit). Everything after max_tokens is optional (leave it empty to skip it).
          # modes are comma separated, e.g. baseline,loop,full; extra_json is added to every request,
          # e.g. {"reasoning_effort":"low"}; split is a file in benchmark/ (default split.json).
          for entry in "${RUNS[@]}"; do
            IFS='|' read -r model tokens repeats modes temperature extra split <<< "$entry"
            modes="${modes:-${MODES:-baseline loop loop+memory full}}"
            echo "=== $model (max_tokens $tokens, repeats ${repeats:-${REPEATS:-1}}, modes ${modes//,/ }, temperature ${temperature:-0}, extra ${extra:-none}, split ${split:-split.json}) ==="
            KINTSUGI_MODEL="$model" KINTSUGI_MAX_TOKENS="$tokens" KINTSUGI_TEMPERATURE="${temperature:-0}" KINTSUGI_EXTRA="$extra" \
              python research/benchmark/run_benchmark.py --model openai --repeats "${repeats:-${REPEATS:-1}}" --sleep "${SLEEP:-0}" \
                --split "${split:-split.json}" --modes ${modes//,/ } || status=1
          done
          exit $status

      - name: Save results to the branch
        if: always()
        run: |
          git config user.name "kintsugi-benchmark"
          git config user.email "actions@users.noreply.github.com"
          git add research/results
          git commit -m "Add benchmark results from GitHub Actions run ${{ github.run_id }}" || exit 0
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: research/results/
