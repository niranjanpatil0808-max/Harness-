# Runs the offline test suite on every push and pull request. No API keys are used.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[push]"
      - run: python -m unittest discover -s tests

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -e ".[push]"
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - run: bash tests/ui/run_all.sh
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright
