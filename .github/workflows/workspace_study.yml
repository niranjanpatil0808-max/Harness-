# Compares models on the workspace's practice suite using a real provider. Makes NO model calls unless
# STUDY_MODELS in examples/study.config lists models. Needs the repository secret KINTSUGI_API_KEY.
# Starts when examples/study.config is pushed to this branch (or by hand from the Actions tab).
name: workspace-study

on:
  push:
    branches: [claude/ecstatic-cray-g930so]
    paths: [examples/study.config]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and run the offline tests
        run: |
          pip install -e .
          python -m unittest discover -s tests
      - name: Compare the models
        env:
          KINTSUGI_API_KEY: ${{ secrets.KINTSUGI_API_KEY }}
          SMOKE_UNATTENDED_OK: "1"   # a throwaway CI runner: code scenarios may run without extra isolation
        run: |
          set -a; . examples/study.config; set +a
          if [ -n "$STUDY_MODELS" ] && [ -z "$KINTSUGI_API_KEY" ]; then
            echo "Secret KINTSUGI_API_KEY is not set." >&2
            exit 1
          fi
          python examples/workspace_study.py --out results/workspace_models.md
      - name: Save the report to the branch
        if: always()
        run: |
          git config user.name "kintsugi-study"
          git config user.email "actions@users.noreply.github.com"
          git add -f results/workspace_models.md 2>/dev/null || true
          git commit -m "Add model comparison report from run ${{ github.run_id }}" || exit 0
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
