# Deploys the workspace on Render (https://render.com) from this repository: New > Blueprint.
# KINTSUGI_TOKEN is generated for you: open the service's Environment tab to read it, then use it to sign in.
# The free plan sleeps when idle and does not keep files between deploys (see docs/HOSTING.md).
services:
  - type: web
    name: kintsugi-workspace
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: KINTSUGI_TOKEN
        generateValue: true
      # No model key is needed here: after you sign in, the app opens Settings > Models and you paste your own key there.
      - key: KINTSUGI_TRUST_PROXY   # Render puts its own proxy in front, which sets X-Forwarded-For (never set this when the port is exposed directly)
        value: "1"
      - key: KINTSUGI_DAILY_CALLS
        value: "300"
