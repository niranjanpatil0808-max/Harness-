<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Kintsugi</title>
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div id="app">
  <div id="scrim" hidden></div>
  <aside id="sidebar" aria-label="Chats and agents"></aside>
  <main id="main">
    <header id="topbar"></header>
    <div id="scroll"><div id="thread" role="log" aria-live="polite"></div><div id="inline"></div></div>
    <button id="jump" hidden>↓ New messages</button>
    <footer id="composer-wrap"></footer>
  </main>
  <aside id="drawer" hidden aria-label="Agent details"></aside>
</div>
<div id="dialog-root"></div>
<div id="toast" role="status"></div>
<script src="/static/vendor/marked.min.js"></script>
<script src="/static/vendor/purify.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
