[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kintsugi"
version = "0.1.0"
description = "A small harness that helps weak open models fix bugs by learning from their mistakes."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
chart = ["matplotlib"]

[project.scripts]
kintsugi = "kintsugi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kintsugi.workspace" = ["web/*.html"]
