[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kintsugi"
version = "0.1.0"
description = "Work with your team and AI agents together: a self-hosted, phone-first shared workspace with task board, rooms, approvals and sandboxed code, on your own API key."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
chart = ["matplotlib"]
push = ["cryptography>=42"]  # phone notifications and encrypted backups (optional)

[project.scripts]
kintsugi = "kintsugi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kintsugi.workspace" = ["web/*.html", "web/*.css", "web/*.js", "web/*.svg", "web/*.webmanifest", "web/icons/*", "web/vendor/*"]
